# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced verbatim from cplieger/ci; never hand-write that file, the next sync
# overwrites it). Health is the baked comms_fresh probe, that is
# `upsc $UPS_NAME@<listen address> ups.status` over the NUT protocol, so
# reaching healthy already proves the from-source binaries run, the generated
# config parses, the driver attached and upsd answers. What it cannot prove is
# anything that happens AFTER boot: the probe is a read, it never moves the UPS,
# and it never involves upsmon, the daemon that turns a power event into a
# notification and a shutdown. So the assertions below drive a real outage
# through the device file and require the reaction to it, which is this image's
# job.
SMOKE_APP_NAME=nut-upsd
# The HEALTHCHECK has a 135s start period and a 30s interval. This allows the
# start period plus two intervals without failing a slow but healthy cold boot.
SMOKE_TIMEOUT=200

# dummy-ups serves a device FILE instead of hardware, and the `.dev` suffix
# selects its dummy-once mode, which re-reads that file whenever it changes.
# That re-read is the only lever a smoke test has to move a UPS. The fixture is
# generated rather than committed because the re-read needs it WRITABLE, and
# rewriting a committed file would dirty the work tree on every local run.
SMOKE_FIXTURE=$(mktemp -d)
# 755, not mktemp's 0700: the driver drops to the `nut` user BEFORE it opens the
# port file (become_user precedes upsdrv_initups in drivers/main.c), so a
# runner-owned 0700 directory fails the driver at boot even though PID 1 is root.
chmod 755 "$SMOKE_FIXTURE"
# The DIRECTORY is mounted, not the file: a file bind mount pins the original
# inode inside the container, so a replaced file never reaches the driver.
# Read-only because the container only ever reads it: dummy-ups has no write path
# at all, and a host-side rename still reaches the driver through a :ro bind.
SMOKE_RUN_ARGS="-e UPS_DRIVER=dummy-ups -e UPS_PORT=/fixtures/dummy.dev -v ${SMOKE_FIXTURE}:/fixtures:ro"

# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  rm -rf "$SMOKE_FIXTURE"
}

# smoke_ups_state STATUS CHARGE RUNTIME: publish one UPS state to the driver.
# Renamed into place because the driver re-reads on its own clock and would
# otherwise read a half-written file.
smoke_ups_state() {
  cat >"$SMOKE_FIXTURE/state.tmp" <<EOF
ups.mfr: cplieger
ups.model: image-smoke dummy
ups.status: $1
battery.charge: $2
battery.runtime: $3
EOF
  chmod 644 "$SMOKE_FIXTURE/state.tmp"
  mv "$SMOKE_FIXTURE/state.tmp" "$SMOKE_FIXTURE/dummy.dev"
}
smoke_ups_state 'OL' 100 3600

# smoke_ups_dump: every variable upsd serves, read through the image's own upsc
# over the NUT protocol, so no port is published and the runner needs no client.
smoke_ups_dump() {
  docker exec "$SMOKE_CONTAINER" upsc ups@127.0.0.1:3493 2>&1
}

# smoke_wait_var VAR VALUE SECONDS: the driver re-read the device file and upsd
# is serving the new value.
smoke_wait_var() {
  _i=0
  while [ "$_i" -lt "$3" ]; do
    smoke_ups_dump | grep -qx "$1: $2" && return 0
    _i=$((_i + 1))
    sleep 1
  done
  printf 'FAIL: upsd never served %s "%s" within %ss (the driver did not re-read the device file); upsc printed:\n%s\n' \
    "$1" "$2" "$3" "$(smoke_ups_dump)" >&2
  return 1
}

# smoke_wait_log PATTERN SECONDS WHAT: poll for a log line, never grep once,
# because the json-file driver can lag the event that produced it.
smoke_wait_log() {
  _i=0
  while [ "$_i" -lt "$2" ]; do
    docker logs "$SMOKE_CONTAINER" 2>&1 | grep -qF -- "$1" && return 0
    _i=$((_i + 1))
    sleep 1
  done
  printf 'FAIL: nut-upsd never logged %s within %ss (%s)\n' "$1" "$2" "$3" >&2
  return 1
}

smoke_verify() {
  # Precondition, fatal for everything below: upsd must serve the value THIS
  # fixture published. The HEALTHCHECK only proves `upsc ups.status` exits 0,
  # which any value satisfies, so this is also where the value gets pinned.
  _dump=$(smoke_ups_dump) || {
    printf 'FAIL: upsc could not read the UPS over the NUT protocol:\n%s\n' "$_dump" >&2
    return 1
  }
  printf '%s\n' "$_dump" | grep -qx 'ups.status: OL' || {
    printf 'FAIL: upsd does not serve the fixture ups.status (OL); upsc printed:\n%s\n' "$_dump" >&2
    return 1
  }

  # A real power cut, in two halves so a failure names its own: first the driver
  # and upsd must take the new device state, then upsmon must CLASSIFY it and
  # run NOTIFYCMD, the execvp path patches/cve-2026-54161-notifycmd-execvp.patch
  # rewrites and the source of every event= line the alert rules match.
  smoke_ups_state 'OB DISCHRG' 60 1200
  smoke_wait_var ups.status 'OB DISCHRG' 30 || return 1
  smoke_wait_log 'event="ONBATT"' 30 'upsmon classified the outage and ran NOTIFYCMD' || return 1

  # Recovery, so a latched or one-way path fails instead of passing on the first
  # transition alone.
  smoke_ups_state 'OL' 100 3600
  smoke_wait_var ups.status OL 30 || return 1
  smoke_wait_log 'event="ONLINE"' 30 'upsmon returned to line power' || return 1

  # Critical battery: this image's ultimate job. upsmon must reach upsd's
  # PRIVILEGED path with the internal credential (a refused `set FSD` keeps the
  # FSD event from ever reaching a client), run the SHUTDOWNCMD arm selected at
  # boot, and end the container so the restart policy decides. Everything from
  # here reads the LOG, never `docker exec`: this state is designed to end the
  # container, and an exec cannot outlive it.
  smoke_ups_state 'OB DISCHRG LB' 3 30
  smoke_wait_log 'event="LOWBATT"' 30 'upsmon classified low battery' || return 1
  smoke_wait_log 'event="FSD"' 30 'upsd accepted the forced-shutdown request' || return 1
  smoke_wait_log 'host will NOT be powered off' 30 'the no-op SHUTDOWNCMD arm ran' || return 1
  _stopped=
  _i=0
  while [ "$_i" -lt 60 ]; do
    if [ "$(docker inspect --format '{{ .State.Running }}' "$SMOKE_CONTAINER")" != true ]; then
      _stopped=yes
      break
    fi
    _i=$((_i + 1))
    sleep 1
  done
  [ -n "$_stopped" ] || {
    printf 'FAIL: upsmon did not end the container after the forced shutdown\n' >&2
    return 1
  }
  _ec=$(docker inspect --format '{{ .State.ExitCode }}' "$SMOKE_CONTAINER")
  [ "$_ec" -eq 0 ] || {
    printf 'FAIL: post-FSD container exit code is %s, not the 0 the restart policy expects\n' "$_ec" >&2
    return 1
  }

  # The teardown an FSD drives is the one with no upsmon left to stop, because
  # upsmon's own exit is what started it. Poll for the completion line FIRST:
  # that is what proves the log flushed past the teardown, so the single-shot
  # absence checks below cannot pass on a log that is merely still catching up.
  smoke_wait_log 'NUT service stop sequence completed' 30 'the teardown ran its stop sequence' || return 1
  if docker logs "$SMOKE_CONTAINER" 2>&1 | grep -qF 'upsmon stop failed'; then
    printf 'FAIL: the teardown issued a upsmon stop control it had nothing to signal\n' >&2
    return 1
  fi
  # Turns the safety property from an inference about SMOKE_RUN_ARGS into an
  # assertion: nut-shutdown.sh logs this before its first dbus-send, so its
  # absence is what proves the D-Bus arm was never the one selected at boot.
  if docker logs "$SMOKE_CONTAINER" 2>&1 | grep -qF 'powering off host'; then
    printf 'FAIL: the host-poweroff SHUTDOWNCMD arm ran; this run must never reach it\n' >&2
    return 1
  fi
  return 0
}
