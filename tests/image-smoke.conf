# The shared harness starts the assembled image, so this covers the ENTRYPOINT,
# env-to-config generation, all three daemons, and the baked HEALTHCHECK.
SMOKE_APP_NAME=nut-upsd
# The HEALTHCHECK has a 135s start period and a 30s interval. This allows the
# start period plus two intervals without failing a slow but healthy cold boot.
SMOKE_TIMEOUT=200
# dummy-ups requires a readable data file. Its `other` transport plus this
# absolute non-USB port keeps the USB-bus precondition out of the smoke path.
# The .dev suffix makes dummy-ups read the fixture once and keep data current.
SMOKE_RUN_ARGS="-e UPS_DRIVER=dummy-ups -e UPS_PORT=/fixtures/dummy.dev -v ${SMOKE_DIR}/image-smoke-dummy.dev:/fixtures/dummy.dev:ro"
