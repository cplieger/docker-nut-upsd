# promtool test rules alerts/promql_test.yaml
rule_files:
- promql.yaml
evaluation_interval: 15s
tests:
- name: a failing scrape pages after 5m and keeps the target labels
  interval: 1m
  input_series:
  - series: up{job="nut-upsd", instance="nut-upsd:9199"}
    values: 1 0x10
  alert_rule_test:
  - eval_time: 4m
    alertname: NutUpsdDown
    exp_alerts: []
  - eval_time: 8m
    alertname: NutUpsdDown
    exp_alerts:
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
      exp_annotations:
        summary: nut-upsd is not being scraped
        description: 'No successful scrape for 5m: the container is stopped, crash-looping or refusing to start, METRICS_PORT is 0, or the scrape cannot reach the exporter. Check the container''s state and its log.

          '
- name: a target that is gone pages through the absent arm
  interval: 1m
  input_series:
  - series: up{job="other", instance="x:1"}
    values: 1x10
  alert_rule_test:
  - eval_time: 6m
    alertname: NutUpsdDown
    exp_alerts:
    - exp_labels:
        severity: warning
        job: nut-upsd
      exp_annotations:
        summary: nut-upsd is not being scraped
        description: 'No successful scrape for 5m: the container is stopped, crash-looping or refusing to start, METRICS_PORT is 0, or the scrape cannot reach the exporter. Check the container''s state and its log.

          '
- name: NutUpsdOnBattery holds for the whole outage and resolves when mains returns
  interval: 15s
  input_series:
  - series: nut_upsd_ups_status{job="nut-upsd", instance="nut-upsd:9199", flag="OB"}
    values: 0 1x240 0x4
  alert_rule_test:
  - eval_time: 15s
    alertname: NutUpsdOnBattery
    exp_alerts: []
  - eval_time: 1m
    alertname: NutUpsdOnBattery
    exp_alerts:
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
        flag: OB
      exp_annotations:
        summary: UPS is on battery after mains power loss (nut-upsd:9199)
        description: 'The UPS reports OB: it lost mains power and carries the load on battery, and the alert holds until mains returns. Check mains power now. NutUpsdLowBattery follows if the battery runs low.

          '
  - eval_time: 60m
    alertname: NutUpsdOnBattery
    exp_alerts:
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
        flag: OB
      exp_annotations:
        summary: UPS is on battery after mains power loss (nut-upsd:9199)
        description: 'The UPS reports OB: it lost mains power and carries the load on battery, and the alert holds until mains returns. Check mains power now. NutUpsdLowBattery follows if the battery runs low.

          '
  - eval_time: 61m
    alertname: NutUpsdOnBattery
    exp_alerts: []
- name: NutUpsdLowBattery fires on the low-battery flag at once
  interval: 1m
  input_series:
  - series: nut_upsd_ups_status{job="nut-upsd", instance="nut-upsd:9199", flag="LB"}
    values: 0 1x3
  alert_rule_test:
  - eval_time: 0m
    alertname: NutUpsdLowBattery
    exp_alerts: []
  - eval_time: 1m
    alertname: NutUpsdLowBattery
    exp_alerts:
    - exp_labels:
        severity: critical
        job: nut-upsd
        instance: nut-upsd:9199
        flag: LB
      exp_annotations:
        summary: UPS reports low battery (nut-upsd:9199)
        description: 'The UPS raised its low-battery flag. Check mains power now. On battery, this starts the shutdown sequence. On line power, the UPS probably misreports it, so check LOWBATT_PERCENT or ignorelb.

          '
- name: NutUpsdCommsLost waits 5m of stale data and resolves when it is fresh again
  interval: 1m
  input_series:
  - series: nut_upsd_ups_data_fresh{job="nut-upsd", instance="nut-upsd:9199"}
    values: 1 0x7 1x3
  alert_rule_test:
  - eval_time: 5m
    alertname: NutUpsdCommsLost
    exp_alerts: []
  - eval_time: 7m
    alertname: NutUpsdCommsLost
    exp_alerts:
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
      exp_annotations:
        summary: UPS communication lost (nut-upsd:9199)
        description: 'upsd has served no fresh data for the UPS for 5m: the data is stale, the driver is gone or upsd does not answer. UPS state is unknown until communication returns. Check the UPS connection.

          '
  - eval_time: 10m
    alertname: NutUpsdCommsLost
    exp_alerts: []
- name: NutUpsdHardwareFault fires per flag, RB and ALARM, and clears with each
  interval: 1m
  input_series:
  - series: nut_upsd_ups_status{job="nut-upsd", instance="nut-upsd:9199", flag="RB"}
    values: 1x10
  - series: nut_upsd_ups_status{job="nut-upsd", instance="nut-upsd:9199", flag="ALARM"}
    values: 0 1x3 0x6
  - series: nut_upsd_ups_status{job="nut-upsd", instance="nut-upsd:9199", flag="OL"}
    values: 1x10
  alert_rule_test:
  - eval_time: 2m
    alertname: NutUpsdHardwareFault
    exp_alerts:
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
        flag: ALARM
      exp_annotations:
        summary: UPS reports a hardware fault (nut-upsd:9199)
        description: 'The UPS reports ALARM: RB is a battery to replace, ALARM an active alarm, named in ups.alarm. With ALARMCRITICAL 1, upstream''s default, losing comms during ALARM forces a shutdown. Plan service.

          '
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
        flag: RB
      exp_annotations:
        summary: UPS reports a hardware fault (nut-upsd:9199)
        description: 'The UPS reports RB: RB is a battery to replace, ALARM an active alarm, named in ups.alarm. With ALARMCRITICAL 1, upstream''s default, losing comms during ALARM forces a shutdown. Plan service.

          '
  - eval_time: 6m
    alertname: NutUpsdHardwareFault
    exp_alerts:
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
        flag: RB
      exp_annotations:
        summary: UPS reports a hardware fault (nut-upsd:9199)
        description: 'The UPS reports RB: RB is a battery to replace, ALARM an active alarm, named in ups.alarm. With ALARMCRITICAL 1, upstream''s default, losing comms during ALARM forces a shutdown. Plan service.

          '
- name: NutUpsdProtectionDegraded holds each of BYPASS, OVER and CAL until it clears
  interval: 1m
  input_series:
  - series: nut_upsd_ups_status{job="nut-upsd", instance="nut-upsd:9199", flag="BYPASS"}
    values: 1x10
  - series: nut_upsd_ups_status{job="nut-upsd", instance="nut-upsd:9199", flag="OVER"}
    values: 1 0x9
  - series: nut_upsd_ups_status{job="nut-upsd", instance="nut-upsd:9199", flag="CAL"}
    values: 0x5 1x5
  - series: nut_upsd_ups_status{job="nut-upsd", instance="nut-upsd:9199", flag="TRIM"}
    values: 1x10
  alert_rule_test:
  - eval_time: 0m
    alertname: NutUpsdProtectionDegraded
    exp_alerts:
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
        flag: BYPASS
      exp_annotations:
        summary: UPS protection is degraded (nut-upsd:9199)
        description: 'The UPS reports BYPASS. CAL is calibration, BYPASS an unprotected load, OVER an overload. Losing comms during CAL or BYPASS forces a shutdown. OVER is critical only when OVERDURATION is configured, and the generated upsmon.conf does not set it.

          '
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
        flag: OVER
      exp_annotations:
        summary: UPS protection is degraded (nut-upsd:9199)
        description: 'The UPS reports OVER. CAL is calibration, BYPASS an unprotected load, OVER an overload. Losing comms during CAL or BYPASS forces a shutdown. OVER is critical only when OVERDURATION is configured, and the generated upsmon.conf does not set it.

          '
  - eval_time: 7m
    alertname: NutUpsdProtectionDegraded
    exp_alerts:
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
        flag: BYPASS
      exp_annotations:
        summary: UPS protection is degraded (nut-upsd:9199)
        description: 'The UPS reports BYPASS. CAL is calibration, BYPASS an unprotected load, OVER an overload. Losing comms during CAL or BYPASS forces a shutdown. OVER is critical only when OVERDURATION is configured, and the generated upsmon.conf does not set it.

          '
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
        flag: CAL
      exp_annotations:
        summary: UPS protection is degraded (nut-upsd:9199)
        description: 'The UPS reports CAL. CAL is calibration, BYPASS an unprotected load, OVER an overload. Losing comms during CAL or BYPASS forces a shutdown. OVER is critical only when OVERDURATION is configured, and the generated upsmon.conf does not set it.

          '
- name: NutUpsdProtectionUnavailable fires on OFF and on a dead upsmon parent
  interval: 1m
  input_series:
  - series: nut_upsd_ups_status{job="nut-upsd", instance="nut-upsd:9199", flag="OFF"}
    values: 0 1 0x5
  - series: nut_upsd_upsmon_parent_alive{job="nut-upsd", instance="nut-upsd:9199"}
    values: 1x3 0x3
  alert_rule_test:
  - eval_time: 0m
    alertname: NutUpsdProtectionUnavailable
    exp_alerts: []
  - eval_time: 1m
    alertname: NutUpsdProtectionUnavailable
    exp_alerts:
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
        flag: 'OFF'
      exp_annotations:
        summary: UPS protection became unavailable (nut-upsd:9199)
        description: 'Either the UPS reports OFF, or upsmon''s parent is not running, so a forced shutdown cannot power off the host. With OFFDURATION 30, upstream''s default, OFF for 30 seconds forces a shutdown. Restart the container for the parent.

          '
  - eval_time: 2m
    alertname: NutUpsdProtectionUnavailable
    exp_alerts: []
  - eval_time: 5m
    alertname: NutUpsdProtectionUnavailable
    exp_alerts:
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
      exp_annotations:
        summary: UPS protection became unavailable (nut-upsd:9199)
        description: 'Either the UPS reports OFF, or upsmon''s parent is not running, so a forced shutdown cannot power off the host. With OFFDURATION 30, upstream''s default, OFF for 30 seconds forces a shutdown. Restart the container for the parent.

          '
- name: NutUpsdProtectionUnavailable stays silent while the container has not started upsmon yet
  interval: 1m
  input_series:
  - series: nut_upsd_ups_status{job="nut-upsd", instance="nut-upsd:9199", flag="OFF"}
    values: 0x5
  - series: nut_upsd_upsmon_parent_alive{job="nut-upsd", instance="nut-upsd:9199"}
    values: _x3 1x2
  alert_rule_test:
  - eval_time: 2m
    alertname: NutUpsdProtectionUnavailable
    exp_alerts: []
  - eval_time: 5m
    alertname: NutUpsdProtectionUnavailable
    exp_alerts: []
- name: NutUpsdPowerOffPathBroken holds while the probe fails and clears at a good probe
  interval: 5m
  input_series:
  - series: nut_upsd_poweroff_path_ok{job="nut-upsd", instance="nut-upsd:9199"}
    values: 1 0x2 1
  alert_rule_test:
  - eval_time: 0m
    alertname: NutUpsdPowerOffPathBroken
    exp_alerts: []
  - eval_time: 15m
    alertname: NutUpsdPowerOffPathBroken
    exp_alerts:
    - exp_labels:
        severity: warning
        job: nut-upsd
        instance: nut-upsd:9199
      exp_annotations:
        summary: UPS host-poweroff path broken (nut-upsd:9199)
        description: 'The last D-Bus probe got no logind answer that permits a non-interactive poweroff, so a forced shutdown would leave the host running. The container log''s probe line names the bus socket or the host polkit policy.

          '
  - eval_time: 20m
    alertname: NutUpsdPowerOffPathBroken
    exp_alerts: []
# The dashboard's Exporter down and Driver restarts queries, with $instance and a 1m or 5m slot filled in.
# TestDashboardQueriesAreTheTestedOnes fails when these differ from the dashboard.
- name: 'Exporter down: shows for an IPv6 target the alert names'
  interval: 1m
  input_series:
  - series: 'up{job="nut-upsd", instance="[::1]:9199"}'
    values: 0x10
  promql_expr_test:
  - expr: &exporter_down '0 * max((ALERTS{alertname="NutUpsdDown", alertstate="firing", instance="[::1]:9199"} or ALERTS{alertname="NutUpsdDown", alertstate="firing", instance=""}))'
    eval_time: 8m
    exp_samples:
    - labels: '{}'
      value: 0
- name: 'Exporter down: stays hidden while only another target is down'
  interval: 1m
  input_series:
  - series: 'up{job="nut-upsd", instance="[::1]:9199"}'
    values: 1x10
  - series: 'up{job="nut-upsd", instance="1:9199"}'
    values: 0x10
  promql_expr_test:
  - expr: *exporter_down
    eval_time: 8m
    exp_samples: []
- name: 'Exporter down: shows when every target is gone'
  interval: 1m
  input_series:
  - series: 'up{job="other", instance="x:1"}'
    values: 1x10
  promql_expr_test:
  - expr: *exporter_down
    eval_time: 8m
    exp_samples:
    - labels: '{}'
      value: 0
- name: 'Driver restarts: a slot one scrape long counts the restarts made in it'
  interval: 1m
  input_series:
  - series: 'nut_upsd_driver_restarts_total{job="nut-upsd", instance="[::1]:9199"}'
    values: 0x10 1 3x10
  promql_expr_test:
  - expr: &driver_restarts 'sum without () (((nut_upsd_driver_restarts_total{instance="[::1]:9199"} - nut_upsd_driver_restarts_total{instance="[::1]:9199"} offset 1m) unless ((min_over_time(nut_upsd_driver_restarts_total{instance="[::1]:9199"}[1m]) < nut_upsd_driver_restarts_total{instance="[::1]:9199"} offset 1m) or (resets(nut_upsd_driver_restarts_total{instance="[::1]:9199"}[1m]) > 0))) or (nut_upsd_driver_restarts_total{instance="[::1]:9199"} and ((min_over_time(nut_upsd_driver_restarts_total{instance="[::1]:9199"}[1m]) < nut_upsd_driver_restarts_total{instance="[::1]:9199"} offset 1m) or (resets(nut_upsd_driver_restarts_total{instance="[::1]:9199"}[1m]) > 0))) or (nut_upsd_driver_restarts_total{instance="[::1]:9199"} - min_over_time(nut_upsd_driver_restarts_total{instance="[::1]:9199"}[1m])))'
    eval_time: 11m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 1
  - expr: *driver_restarts
    eval_time: 12m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 2
  - expr: *driver_restarts
    eval_time: 14m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 0
- name: 'Driver restarts: a container restart counts the new total, not the drop from the old one'
  interval: 1m
  input_series:
  - series: 'nut_upsd_driver_restarts_total{job="nut-upsd", instance="[::1]:9199"}'
    values: 3x10 1x10
  promql_expr_test:
  - expr: *driver_restarts
    eval_time: 11m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 1
- name: 'Driver restarts: a first scrape counts the growth inside the slot, not the lifetime total'
  interval: 1m
  input_series:
  - series: 'nut_upsd_driver_restarts_total{job="nut-upsd", instance="[::1]:9199"}'
    values: _x11 7 8x10
  promql_expr_test:
  - expr: *driver_restarts
    eval_time: 11m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 0
  - expr: *driver_restarts
    eval_time: 12m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 1
- name: 'Driver restarts: a failed scrape draws no false spike'
  interval: 1m
  input_series:
  - series: 'nut_upsd_driver_restarts_total{job="nut-upsd", instance="[::1]:9199"}'
    values: 4x10 stale 4x10
  promql_expr_test:
  - expr: *driver_restarts
    eval_time: 12m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 0
- name: 'Driver restarts: a failed scrape at the start of a slot can show fewer than happened'
  interval: 1m
  input_series:
  - series: 'nut_upsd_driver_restarts_total{job="nut-upsd", instance="[::1]:9199"}'
    values: 0x4 stale 1x10
  promql_expr_test:
  - expr: *driver_restarts
    eval_time: 6m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 0
- name: 'Driver restarts: a scrape outage that leaves no stale marker can show more than happened'
  interval: 1m
  input_series:
  - series: 'nut_upsd_driver_restarts_total{job="nut-upsd", instance="[::1]:9199"}'
    values: 0x4 _ _ 3x3
  promql_expr_test:
  - expr: *driver_restarts
    eval_time: 7m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 3
- name: 'Driver restarts: a container restart whose counter climbs back to the slot-start value counts the new total'
  interval: 1m
  input_series:
  - series: 'nut_upsd_driver_restarts_total{job="nut-upsd", instance="[::1]:9199"}'
    values: 4x5 0 1 2 3 4 5 6
  promql_expr_test:
  - expr: &driver_restarts_5m 'sum without () (((nut_upsd_driver_restarts_total{instance="[::1]:9199"} - nut_upsd_driver_restarts_total{instance="[::1]:9199"} offset 5m) unless ((min_over_time(nut_upsd_driver_restarts_total{instance="[::1]:9199"}[5m]) < nut_upsd_driver_restarts_total{instance="[::1]:9199"} offset 5m) or (resets(nut_upsd_driver_restarts_total{instance="[::1]:9199"}[5m]) > 0))) or (nut_upsd_driver_restarts_total{instance="[::1]:9199"} and ((min_over_time(nut_upsd_driver_restarts_total{instance="[::1]:9199"}[5m]) < nut_upsd_driver_restarts_total{instance="[::1]:9199"} offset 5m) or (resets(nut_upsd_driver_restarts_total{instance="[::1]:9199"}[5m]) > 0))) or (nut_upsd_driver_restarts_total{instance="[::1]:9199"} - min_over_time(nut_upsd_driver_restarts_total{instance="[::1]:9199"}[5m])))'
    eval_time: 10m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 4
- name: 'Driver restarts: a slot five scrapes long counts every restart made in it'
  interval: 1m
  input_series:
  - series: 'nut_upsd_driver_restarts_total{job="nut-upsd", instance="[::1]:9199"}'
    values: 0x5 1+1x10
  promql_expr_test:
  - expr: *driver_restarts_5m
    eval_time: 10m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 5
- name: 'Driver restarts: an exporter respawn inside a running container counts only the new restarts'
  interval: 1m
  input_series:
  - series: 'nut_upsd_driver_restarts_total{job="nut-upsd", instance="[::1]:9199"}'
    values: 3x5 _ 3 4x5
  promql_expr_test:
  - expr: *driver_restarts_5m
    eval_time: 10m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 1
- name: 'Driver restarts: a container restart after a failed scrape at the start of a slot counts the new total'
  interval: 1m
  input_series:
  - series: 'nut_upsd_driver_restarts_total{job="nut-upsd", instance="[::1]:9199"}'
    values: 5x4 stale 3 4 stale 1 2 2
  promql_expr_test:
  - expr: *driver_restarts_5m
    eval_time: 10m
    exp_samples:
    - labels: '{instance="[::1]:9199", job="nut-upsd"}'
      value: 2
