# Recommended alert rules for docker-nut-upsd. Loki ruler (LogQL) rule group:
# ship the container's logs to Loki (e.g. Grafana Alloy's Docker log discovery)
# and evaluate these with Loki's ruler; firing alerts deliver through your
# Alertmanager like any Prometheus alert. The rules key on structured lines
# the image writes: the event=<TYPE> lines from upsmon's NOTIFYCMD (wired by
# the generated upsmon.conf out of the box) and, when host shutdown is
# enabled, the D-Bus poweroff-path probe's error line. Thresholds, the for:
# windows, and the severity labels are starting points; adjust the container
# selector to your deployment.
#
# The event and msg rules below read PARSED logfmt fields, so a token inside a
# quoted value cannot match one; the level-prefix rule (UPSContainerError) reads
# the line position instead, deliberately. One consequence of the parser: where a
# collector already sets a stream label with the same name as a field these rules
# filter on (event, msg), the parsed value lands as event_extracted /
# msg_extracted and every rule filtering that field then matches nothing.
#
# Two shapes live in this group and each rule below says which it is. A STATE
# rule is honest only where the producer RE-EMITS its line while the condition
# holds, so the window can be sized above that cadence: UPSCommsLost (upsmon
# repeats NOCOMM every NOCOMMWARNTIME) and UPSPowerOffPathBroken (the probe
# repeats its error every DBUS_PROBE_INTERVAL). A TRANSITION rule marks a
# change and resolves when its line ages out; it does NOT track the state, and
# no window value can make it, because the quantity it would have to outlast
# is the duration of the condition. Which shape a rule may honestly take is
# decided by ITS OWN producer's cadence, and those differ per event, so each
# rule below states its cadence in its own annotation - two of them come
# straight from NUT's re-notification knobs (NOCOMMWARNTIME, RBWARNTIME).
# Continuous UPS state is not in this log stream at all - it is on the NUT
# protocol on port 3493 (upsc's ups.status), so alert on a NUT metrics
# exporter if you want a latched "still on battery" alarm.
groups:
  - name: nut-upsd
    # Evaluate every 10s instead of the ruler's 1m default. UPSOnBattery pairs
    # this with for: 10s, so the on-battery condition must hold across one full
    # interval before it fires: a mains flicker (a load surge from a device on
    # the UPS, e.g. a laser printer's fuser inrush) clears within one upsmon
    # poll and stays silent, while a real outage fires in roughly 10-20s. A 1m
    # evaluation would delay that by up to a minute, which is too long when the
    # runtime left depends on the load and can be short. This applies to every
    # rule in the group; raise it if the extra query load is not worth it for
    # the slower rules below.
    interval: 10s
    rules:
      # Mains transition, read from the event PAIR: upsmon logs ONBATT when it
      # loses mains and ONLINE when it returns, so more ONBATT than ONLINE means
      # the most recent transition the window still holds was onto battery.
      #
      # Two arms joined by or, and neither one covers the other's case:
      #   1. the comparison arm handles a window holding BOTH events. It is what
      #      keeps a flicker quiet, and it is what still fires when an earlier
      #      flicker is followed by a real outage (2 ONBATT vs 1 ONLINE).
      #   2. the unless arm handles the common case, a first outage with no
      #      ONLINE in the window at all. There the comparison's right side has
      #      NO series, so the comparison returns no result and arm 1 alone
      #      could never fire. It cannot replace arm 1 either: one earlier
      #      flicker makes ONLINE non-empty and would suppress a real outage.
      # Same shape, and the same reason, as the two-arm up == 0 or absent(up)
      # reachability pair.
      #
      # TRANSITION rule (see the file header). The 2m window is sized on the
      # only cadence the expression controls: both halves of a flicker land
      # within about 2x POLLFREQ (default 5s), so raise this window if you
      # raise POLLFREQ. It deliberately does NOT try to cover an outage -
      # nothing repeats event=ONBATT - so the alert marks mains loss and
      # resolves 2m later while the UPS may still be carrying the load. The
      # window also bounds the one gap in the pair: an earlier outage whose
      # ONBATT has aged out while its ONLINE has not ties the counts, so a
      # new outage can stay quiet for at most one window.
      - alert: UPSOnBattery
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} | logfmt | event="ONBATT" [2m]
          )) > sum by (container) (count_over_time(
            {container="nut-upsd"} | logfmt | event="ONLINE" [2m]
          ))
          or
          sum by (container) (count_over_time(
            {container="nut-upsd"} | logfmt | event="ONBATT" [2m]
          )) > 0
          unless
          sum by (container) (count_over_time(
            {container="nut-upsd"} | logfmt | event="ONLINE" [2m]
          )) > 0
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "UPS is on battery - mains power lost ({{ $labels.container }})"
          description: >
            nut-upsd logged an ONBATT event with no ONLINE event after it in
            the last 2 minutes: mains power was lost and the UPS took the
            connected load onto its battery. NUT reports that transition once
            (NUT v2.8.5 clients/upsmon.c ups_on_batt :880, ups_on_line :900),
            so this alert marks it and then resolves; it does not track how
            long the UPS stays on battery. For that, read ups.status over the
            NUT protocol. How long it holds depends on that load and on the battery's
            size and age, so judge the urgency from the runtime your own UPS
            reports rather than from a fixed figure. Check mains power now.
            UPSLowBattery is the escalation when the battery runs down.
      - alert: UPSLowBattery
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} | logfmt | event="LOWBATT" [5m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "UPS reports low battery ({{ $labels.container }})"
          description: >
            nut-upsd logged a NUT LOWBATT event: the UPS raised its low-battery
            flag. NUT notifies on that flag alone, so check whether the UPS is
            also on battery: on battery plus low battery starts the shutdown
            sequence, while a low-battery flag raised on line power points at
            the UPS reporting it wrongly (see LOWBATT_PERCENT / ignorelb).
            Verify mains power and the connected-load runtime now. NUT reports
            this flag once when it is raised (NUT v2.8.5 clients/upsmon.c
            ups_low_batt :1746), so this alert marks that transition rather
            than tracking the state.
      - alert: UPSForcedShutdown
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} | logfmt | event=~"FSD|SHUTDOWN" [5m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "UPS forced-shutdown initiated ({{ $labels.container }})"
          description: >
            nut-upsd logged an FSD/SHUTDOWN event: the shutdown sequence has
            started. With SHUTDOWN_ON_BATTERY_CRITICAL=true, the container
            attempts a host poweroff; UPSPowerOffFailed reports its outcome,
            while UPSPowerOffPathBroken watches the same path predictively.
            With the shipped default (false), nut-shutdown-noop.sh logs the
            event, no host is powered off, upsmon's privileged parent exits
            after SHUTDOWNCMD, and this container exits with it. The example's
            restart: unless-stopped re-enters monitoring, so this transition
            alert fires again approximately once per container life until
            mains power returns or the UPS stops supplying the load. Continuous
            state is on the NUT protocol; read ups.status there.
      - alert: UPSCommsLost
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} | logfmt | event="NOCOMM" [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "UPS communication lost ({{ $labels.container }})"
          description: >
            nut-upsd logged a NOCOMM event: upsmon could not reach the UPS for
            at least NOCOMMWARNTIME seconds (default 300), and repeats it every
            NOCOMMWARNTIME seconds while comms stay down. UPS state is unknown
            until communication is restored. Keep this window above twice your
            NOCOMMWARNTIME so the alert stays firing between warnings.
      - alert: UPSHardwareFault
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} | logfmt | event=~"REPLBATT|ALARM" [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "UPS reports a hardware fault ({{ $labels.container }})"
          description: >
            nut-upsd logged a REPLBATT or ALARM event: the UPS reports its own
            hardware fault, and the detail field carries what it named (worn
            battery, no battery installed, fan failure, overheat, charger
            failure, battery voltage out of range). The UPS may not carry the
            load through the next outage. NUT raises ALARM once per change and
            repeats REPLBATT every RBWARNTIME seconds (default 43200), so this
            alert marks each event rather than tracking the state - a
            replace-battery condition re-notifies at RBWARNTIME, so expect this
            alert to fire again about every 12h on the defaults until the
            battery is serviced, which is NUT's own reminder cadence rather
            than a flap; read the UPS status and plan service.
      - alert: UPSPowerOffPathBroken
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} | logfmt | msg=~"D-Bus poweroff path unreachable.*" [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "UPS host-poweroff path broken ({{ $labels.container }})"
          description: >
            nut-upsd has SHUTDOWN_ON_BATTERY_CRITICAL enabled and its periodic
            probe (every DBUS_PROBE_INTERVAL seconds, default 300) asked logind
            CanPowerOff over the mounted system bus and did not get an answer
            that permits a non-interactive poweroff. A green probe proves that
            logind owns the bus name and that the standing authorisation posture
            permits the call. It is not an end-to-end verdict, its sample is as
            old as one DBUS_PROBE_INTERVAL, and it cannot protect inhibitor
            locks. On systemd v257 or later, a block inhibitor makes logind
            refuse the real PowerOff call before polkit, while CanPowerOff still
            answers yes. On older systemd releases, root silently overrides the
            inhibitor and powers off despite the lock. Read the detail field: a
            missing socket or bus error points at
            /run/dbus/system_bus_socket or the host D-Bus daemon, while an
            authorisation answer points at the host's polkit decision for
            org.freedesktop.login1.power-off. A user-namespace remap is a common
            cause because the sender loses the euid-0 shortcut and the shipped
            power-off policy asks for admin authentication that a non-interactive
            call cannot supply. Keep the window above twice DBUS_PROBE_INTERVAL
            or the alert flaps between probes; it also stays firing for up to one
            window after the path recovers.
      - alert: UPSPowerOffFailed
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} | logfmt | msg=~"D-Bus poweroff failed after.*" [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "UPS host poweroff was not confirmed ({{ $labels.container }})"
          description: >
            nut-upsd ran its SHUTDOWNCMD with host shutdown enabled and every
            D-Bus PowerOff attempt failed. The host was still running while the
            UPS was about to stop supplying it, so treat each load on this UPS as
            having lost power without a clean shutdown. TRANSITION rule (see the
            file header): the line is written once per forced-shutdown attempt,
            and the example restart policy re-enters monitoring. A UPS that stays
            critical produces another attempt and this alert fires approximately
            once per container life until mains power returns. Read the failure
            line's detail field for the bus or authorisation error. The following
            "D-Bus poweroff inhibitors at failure" line names current lock
            holders. On systemd v257 or later, a block inhibitor causes this
            failure before polkit. On older systemd releases, root silently
            overrides the lock, so this alert does not fire for that condition.
      # The container's own refusals, collapsed by level rather than
      # enumerated: env-var refusals, boot aborts, TLS provisioning failures,
      # repeated watchdog recovery at its backoff cadence, and forced-shutdown
      # path records log level=error. The forced-shutdown event line also fires
      # UPSForcedShutdown, and an unconfirmed host poweroff also fires
      # UPSPowerOffFailed. A startup refusal exits the container, so restart:
      # retries it and the line recurs on every attempt; the image HEALTHCHECK
      # cannot report it because the refusal exits inside the 15s start period
      # and the first probe is only due at 30s. The matcher is anchored at line
      # start so level=error inside another record's detail cannot fire it. The
      # exclusion drops the event handler's own lines.
      - alert: UPSContainerError
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"}
            |~ `^level=error `
            != `msg="UPS event"` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "nut-upsd logged an error ({{ $labels.container }})"
          description: >
            The container logged a level=error line of its own: an invalid
            environment variable, a NUT daemon that failed to start, a missing
            /dev/bus/usb, a TLS certificate it could not provision, a comms
            watchdog that escalated to its slower backoff retry cadence, or a
            forced-shutdown path record. A startup refusal exits the container,
            so the restart policy retries it and repeats the line while the UPS
            goes unmonitored; the healthcheck cannot report that state because
            the refusal happens inside its start period. This rule is a net under
            the others and is not exclusive of them. A broken D-Bus poweroff path
            also fires UPSPowerOffPathBroken, and an unconfirmed host poweroff
            also fires UPSPowerOffFailed. Read the line for the exact failure.
