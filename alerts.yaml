# Recommended alert rules for docker-nut-upsd. Loki ruler (LogQL) rule group:
# ship the container's logs to Loki (e.g. Grafana Alloy's Docker log discovery)
# and evaluate these with Loki's ruler; firing alerts deliver through your
# Alertmanager like any Prometheus alert. The rules key on structured lines
# the image writes: the event=<TYPE> lines from upsmon's NOTIFYCMD (wired by
# the generated upsmon.conf out of the box) and, when host shutdown is
# enabled, the D-Bus poweroff-path probe's error line. Thresholds, the for:
# windows, and the severity labels are starting points; adjust the container
# selector to your deployment.
groups:
  - name: nut-upsd
    # Evaluate every 10s instead of the ruler's 1m default. UPSOnBattery pairs
    # this with for: 10s, so the on-battery condition must hold across one full
    # interval before it fires: a mains flicker (a load surge from a device on
    # the UPS, e.g. a laser printer's fuser inrush) clears within one upsmon
    # poll and stays silent, while a real outage fires in roughly 10-20s. A 1m
    # evaluation would delay that by up to a minute, which is too long when the
    # runtime left depends on the load and can be short. This applies to every
    # rule in the group; raise it if the extra query load is not worth it for
    # the slower rules below.
    interval: 10s
    rules:
      # Mains state, reconstructed from the event PAIR: upsmon logs ONBATT when
      # it loses mains and ONLINE when it returns, so more ONBATT than ONLINE in
      # the window means the last transition was onto battery and the UPS is
      # carrying the load right now.
      #
      # Two arms joined by or, and neither one covers the other's case:
      #   1. the comparison arm handles a window holding BOTH events. It is what
      #      keeps a flicker quiet, and it is what still fires when an earlier
      #      flicker is followed by a real outage (2 ONBATT vs 1 ONLINE).
      #   2. the unless arm handles the common case, a first outage with no
      #      ONLINE in the window at all. There the comparison's right side has
      #      NO series, so the comparison returns no result and arm 1 alone
      #      could never fire. It cannot replace arm 1 either: one earlier
      #      flicker makes ONLINE non-empty and would suppress a real outage.
      # Same shape, and the same reason, as the two-arm up == 0 or absent(up)
      # reachability pair.
      #
      # The 10m window is far longer than any UPS runtime, so the alert cannot
      # go quiet while the UPS is still on battery, and it is long enough to
      # hold both halves of a flicker (POLLFREQ, default 5s, apart).
      - alert: UPSOnBattery
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} |= `event=ONBATT` [10m]
          )) > sum by (container) (count_over_time(
            {container="nut-upsd"} |= `event=ONLINE` [10m]
          ))
          or
          sum by (container) (count_over_time(
            {container="nut-upsd"} |= `event=ONBATT` [10m]
          )) > 0
          unless
          sum by (container) (count_over_time(
            {container="nut-upsd"} |= `event=ONLINE` [10m]
          )) > 0
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "UPS is on battery - mains power lost ({{ $labels.container }})"
          description: >
            nut-upsd logged an ONBATT event with no ONLINE event after it: mains
            power is gone and the UPS carries the connected load from its
            battery. How long it holds depends on that load and on the battery's
            size and age, so judge the urgency from the runtime your own UPS
            reports rather than from a fixed figure. Check mains power now.
            UPSLowBattery is the escalation when the battery runs down.
      - alert: UPSLowBattery
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} |= `event=LOWBATT` [5m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "UPS low battery - shutdown imminent ({{ $labels.container }})"
          description: >
            nut-upsd logged a NUT LOWBATT event: the UPS raised its low-battery
            flag. NUT notifies on that flag alone, so check whether the UPS is
            also on battery: on battery plus low battery starts the shutdown
            sequence, while a low-battery flag raised on line power points at
            the UPS reporting it wrongly (see LOWBATT_PERCENT / ignorelb).
            Verify mains power and the connected-load runtime now.
      - alert: UPSForcedShutdown
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} |~ `event=(FSD|SHUTDOWN)` [5m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "UPS forced-shutdown initiated ({{ $labels.container }})"
          description: >
            nut-upsd logged an FSD/SHUTDOWN event: the shutdown sequence has
            started and unprotected power loss is imminent for all UPS-fed
            equipment. An exhausted battery is the common cause; an operator
            FSD command and too few healthy power sources raise the same
            event.
      - alert: UPSCommsLost
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} |= `event=NOCOMM` [5m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "UPS communication lost ({{ $labels.container }})"
          description: >
            nut-upsd logged a NOCOMM event: upsmon could not reach the UPS for
            at least NOCOMMWARNTIME seconds (default 300). UPS state is unknown
            until communication is restored.
      - alert: UPSHardwareFault
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} |~ `event=(REPLBATT|ALARM)` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "UPS reports a hardware fault ({{ $labels.container }})"
          description: >
            nut-upsd logged a REPLBATT or ALARM event: the UPS reports its own
            hardware fault, and the detail field carries what it named (worn
            battery, no battery installed, fan failure, overheat, charger
            failure, battery voltage out of range). The UPS may not carry the
            load through the next outage. NUT raises ALARM once per change and
            repeats REPLBATT every RBWARNTIME seconds (default 43200), so this
            alert marks the event rather than tracking the state; read the UPS
            status and plan service.
      - alert: UPSPowerOffPathBroken
        expr: |
          sum by (container) (count_over_time(
            {container="nut-upsd"} |= `D-Bus poweroff path unreachable` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "UPS host-poweroff path broken ({{ $labels.container }})"
          description: >
            nut-upsd has SHUTDOWN_ON_BATTERY_CRITICAL enabled but its periodic
            D-Bus liveness probe (every DBUS_PROBE_INTERVAL seconds, default
            300) cannot reach logind through the mounted system bus socket. A
            forced shutdown right now would NOT power off the host. Check the
            /run/dbus/system_bus_socket mount and the host D-Bus daemon.
